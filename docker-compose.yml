# Local development: `docker compose up db`, then run the backend and `npm run dev`.
# Full stack as it runs in production: `docker compose up --build`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - radar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/radar
      DATABASE_USER: radar
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-radar}
      FORWARD_HEADERS_STRATEGY: none
    ports:
      - "127.0.0.1:8080:8080"
    profiles: [full]

volumes:
  radar-db:
